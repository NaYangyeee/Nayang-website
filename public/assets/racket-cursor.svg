<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- 球拍光标。热点在拍面中心 (24,17)：光标会落在你想点的地方。 -->
  <!-- 拍框 -->
  <ellipse cx="24" cy="17" rx="13" ry="10.5" fill="none" stroke="#1c2026" stroke-width="2.6"/>
  <ellipse cx="24" cy="17" rx="11" ry="8.5" fill="rgba(240,244,238,0.08)" stroke="#9fb6c9" stroke-width="1.2"/>
  <!-- 拍线 -->
  <g stroke="#a8c0d4" stroke-width="0.7" opacity="0.9">
    <line x1="12.5" y1="17" x2="35.5" y2="17"/>
    <line x1="16" y1="9.5" x2="16" y2="24.5"/>
    <line x1="20" y1="8" x2="20" y2="26"/>
    <line x1="24" y1="7.5" x2="24" y2="26.5"/>
    <line x1="28" y1="8" x2="28" y2="26"/>
    <line x1="32" y1="9.5" x2="32" y2="24.5"/>
    <line x1="15" y1="12" x2="33" y2="22"/>
    <line x1="15" y1="22" x2="33" y2="12"/>
  </g>
  <!-- 中杆 -->
  <path d="M24 27.5 L24 38" stroke="#1c2026" stroke-width="2.2" stroke-linecap="round"/>
  <!-- 手柄 -->
  <rect x="20" y="38" width="8" height="9" rx="3" fill="#7a3b2e" stroke="#1c2026" stroke-width="1.2"/>
  <line x1="20" y1="41.5" x2="28" y2="41.5" stroke="#e9d5b8" stroke-width="0.8" opacity="0.6"/>
  <line x1="20" y1="44.5" x2="28" y2="44.5" stroke="#e9d5b8" stroke-width="0.8" opacity="0.6"/>
</svg>
